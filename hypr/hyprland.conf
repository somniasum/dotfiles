############################
##   hyprland.conf
##   minimal · gaming · code
##
##   Color palette (used across all configs):
##   base:    #0a0a0a  darkest bg
##   surface: #1a1a1a  panel bg
##   border:  #2d2d2d  separators
##   text:    #e0e0e0  primary text
##   dim:     #888888  dimmed text
##   blue:    #7aa2f7  accent / active
##   purple:  #bb9af7  gradient end
##   green:   #9ece6a  success
##   yellow:  #e0af68  warning
##   red:     #f7768e  critical
############################

##─────────────────────────────────
## MONITORS
## Run `hyprctl monitors` to list yours.
## Format: name, resolution@hz, position, scale
##─────────────────────────────────
monitor = HDMI-A-2, 1366x768@59.62, auto, 1
# monitor = DP-1, 2560x1440@165, 0x0, 1

##─────────────────────────────────
## AUTOSTART
##─────────────────────────────────
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = hypridle
exec-once = hyprpaper
exec-once = waybar
exec-once = mako
exec-once = wl-paste --type text  --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

##─────────────────────────────────
## ENVIRONMENT VARIABLES
##─────────────────────────────────
env = XCURSOR_THEME, Adwaita
env = XCURSOR_SIZE, 24
env = QT_QPA_PLATFORM, wayland
env = QT_QPA_PLATFORMTHEME, qt5ct
env = XDG_CURRENT_DESKTOP, Hyprland
env = XDG_SESSION_TYPE, wayland
env = XDG_SESSION_DESKTOP, Hyprland
env = MOZ_ENABLE_WAYLAND, 1
env = GDK_BACKEND, wayland,x11
env = SDL_VIDEODRIVER, wayland
env = CLUTTER_BACKEND, wayland

##─────────────────────────────────
## INPUT
##─────────────────────────────────
input {
    kb_layout    = us              # change to your layout, e.g. gb, de
    follow_mouse = 1

    sensitivity   = 0              # 0 = no modification; range -1.0 to 1.0
    accel_profile = flat           # flat = no acceleration (recommended for gaming)

    touchpad {
        natural_scroll = true
        tap-to-click   = true
    }
}

##─────────────────────────────────
## GENERAL
##─────────────────────────────────
general {
    gaps_in    = 4
    gaps_out   = 8
    border_size = 2

    # gradient border: blue → purple diagonal
    col.active_border   = rgba(7aa2f7ff) rgba(bb9af7ff) 45deg
    col.inactive_border = rgba(2d2d2dff)

    layout = master          # see LAYOUT section below

    resize_on_border        = true   # drag window edges to resize, not just title bar
    extend_border_grab_area = 12     # wider invisible grab zone around edges
    hover_icon_on_border    = true   # cursor changes to resize arrow near edges

    allow_tearing = true     # low-latency tearing for games
                             # pair with windowrulev2 = immediate per-game
}

##─────────────────────────────────
## DECORATION
##─────────────────────────────────
decoration {
    rounding = 8

    active_opacity   = 1.0
    inactive_opacity = 0.93

    dim_inactive = true
    dim_strength = 0.08    # subtle — guides focus without being distracting

    blur {
        enabled           = false   # off on 1366x768; enable if GPU has headroom
        size              = 3
        passes            = 2
        new_optimizations = true
    }

    shadow {
        enabled = false
    }
}

##─────────────────────────────────
## ANIMATIONS
##─────────────────────────────────
animations {
    enabled = true

    bezier = swift,   0.25, 1,   0.35, 1
    bezier = snappy,  0.4,  0,   0.2,  1
    bezier = easeOut, 0,    0,   0.2,  1

    animation = windows,          1, 3, swift
    animation = windowsOut,       1, 3, swift,   popin 85%
    animation = windowsMove,      1, 3, snappy             # smooth repositioning in master layout
    animation = border,           1, 5, default
    animation = fade,             1, 3, default
    animation = workspaces,       1, 3, swift,   slide
    animation = specialWorkspace, 1, 4, swift,   slidevert
    animation = layers,           1, 2, easeOut, slide     # waybar / mako slide in
}

##─────────────────────────────────
## LAYOUT — master
##
## One large master window + a slave stack on the right.
## Far more predictable than dwindle for coding:
##   - First window = master, takes 55% of screen
##   - Every new window goes to the slave stack — never steals your focus
##   - Super+Space         = promote focused window to master
##   - Super+Shift+Space   = jump focus back to master
##   - Super+Tab / Shift   = cycle through windows
##─────────────────────────────────
master {
    mfact              = 0.55      # master takes 55% of screen width
    new_status         = slave     # new windows go to slave stack (was: new_is_master)
    orientation        = left      # master on left, slaves stacked right
    smart_resizing     = true      # resize direction based on mouse position
    drop_at_cursor     = true      # drag-drop window to cursor position
}

misc {
    disable_hyprland_logo    = true
    disable_splash_rendering = true
    mouse_move_enables_dpms  = true
    key_press_enables_dpms   = true
    focus_on_activate        = true   # auto-focus window when it requests activation
    on_focus_under_fullscreen = 2     # exit fullscreen when a new window is opened
                                      # (was: new_window_takes_over_fullscreen)
}

##─────────────────────────────────
## KEYBINDS
##─────────────────────────────────
$mod      = SUPER
$term     = foot
$launcher = fuzzel
$browser  = brave
$files    = nautilus

# ── Apps ──────────────────────────────────────────────
bind = $mod,       Return, exec, $term
bind = $mod,       Q,      exec, $launcher
bind = $mod,       V,      exec, $browser
bind = $mod,       W,      exec, $files

# ── Window management ─────────────────────────────────
bind = $mod,       Z,      killactive
bind = $mod SHIFT, E,      exit
bind = $mod,       F,      fullscreen, 0        # true fullscreen
bind = $mod SHIFT, F,      fullscreen, 1        # maximize (keeps bar)
bind = $mod,       V,      togglefloating

# ── Master layout ─────────────────────────────────────
bind = $mod,       Space,  layoutmsg, swapwithmaster   # promote focused → master
bind = $mod SHIFT, Space,  layoutmsg, focusmaster      # jump focus to master
bind = $mod,       Tab,    cyclenext                   # cycle focus forward
bind = $mod SHIFT, Tab,    cyclenext, prev             # cycle focus backward

# ── Focus (vim keys) ──────────────────────────────────
bind = $mod, H, movefocus, l
bind = $mod, L, movefocus, r
bind = $mod, K, movefocus, u
bind = $mod, J, movefocus, d

# ── Move windows ──────────────────────────────────────
bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, L, movewindow, r
bind = $mod SHIFT, K, movewindow, u
bind = $mod SHIFT, J, movewindow, d

# ── Resize windows ────────────────────────────────────
binde = $mod ALT, H, resizeactive, -40  0
binde = $mod ALT, L, resizeactive,  40  0
binde = $mod ALT, K, resizeactive,   0 -40
binde = $mod ALT, J, resizeactive,   0  40

# ── Workspaces ────────────────────────────────────────
bind = $mod,       1, workspace, 1
bind = $mod,       2, workspace, 2
bind = $mod,       3, workspace, 3
bind = $mod,       4, workspace, 4
bind = $mod,       5, workspace, 5
bind = $mod,       6, workspace, 6
bind = $mod,       7, workspace, 7
bind = $mod,       8, workspace, 8
bind = $mod,       9, workspace, 9
bind = $mod,       0, workspace, 10

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up,   workspace, e-1

# ── Mouse: move / resize floating ─────────────────────
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# ── Screenshots ───────────────────────────────────────
bind = ,      Print, exec, grim -g "$(slurp)" - | wl-copy
bind = SHIFT, Print, exec, grim ~/Pictures/$(date +%Y%m%d-%H%M%S).png

# ── Clipboard history ─────────────────────────────────
bind = $mod, C, exec, cliphist list | fuzzel --dmenu | cliphist decode | wl-copy

# ── Media / Hardware keys ─────────────────────────────
bind = $mod, M, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind = $mod, N, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- 

bindel = , XF86AudioRaiseVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute,         exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl  = , XF86AudioPlay,         exec, playerctl play-pause
bindl  = , XF86AudioNext,         exec, playerctl next
bindl  = , XF86AudioPrev,         exec, playerctl previous
bindel = , XF86MonBrightnessUp,   exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# ── Gaming ────────────────────────────────────────────
bind = $mod, G, workspace, 9    # dedicated game workspace

##─────────────────────────────────
## WORKSPACE RULES
## Smart gaps: replaces the removed misc:no_gaps_when_only (removed in 0.45)
## Single tiled window = full screen, no wasted gaps or borders.
##─────────────────────────────────
workspace = w[tv1], gapsout:0, gapsin:0
workspace = f[1],   gapsout:0, gapsin:0

