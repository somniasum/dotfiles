# hypridle.conf — idle management
# Adjust timeouts (in seconds) to taste.
# Note: brightnessctl dim only works on laptops/DDC-capable monitors.
# On a desktop without DDC, remove the dim listener or replace with
# a notification: `notify-send "Screen locking soon"`

general {
    lock_cmd            = pidof hyprlock || hyprlock   # don't spawn multiple instances
    before_sleep_cmd    = pidof hyprlock || hyprlock
    after_sleep_cmd     = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false   # respect apps that block idle (e.g. video players)
}

# 4 min — dim screen
listener {
    timeout    = 240
    on-timeout = brightnessctl -s set 20%
    on-resume  = brightnessctl -r
}

# 8 min — lock
listener {
    timeout    = 480
    on-timeout = pidof hyprlock || hyprlock
}

# 10 min — turn off display
listener {
    timeout    = 600
    on-timeout = hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on
}

# 30 min — suspend
listener {
    timeout    = 1800
    on-timeout = systemctl suspend
}
